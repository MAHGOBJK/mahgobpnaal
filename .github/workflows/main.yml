name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    # 🟢 تثبيت جافا 17 المتوافقة تماماً مع خوادم البناء الحديثة لإنهاء خطأ الـ JVM
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Auto-generate missing Gradle Wrapper Jar
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
        if [ ! -z "$GRADLEW_PATH" ]; then
          MODULE_DIR=$(dirname "$GRADLEW_PATH")
          cd "$MODULE_DIR"
          gradle wrapper --gradle-version 7.4
        else
          gradle wrapper --gradle-version 7.4
        fi

    - name: Grant execute permission for gradlew
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
        if [ ! -z "$GRADLEW_PATH" ]; then
          chmod +x "$GRADLEW_PATH"
        else
          exit 1
        fi

    - name: Build with Gradle
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
        if [ ! -z "$GRADLEW_PATH" ]; then
          MODULE_DIR=$(dirname "$GRADLEW_PATH")
          cd "$MODULE_DIR"
          ./gradlew assembleDebug
        else
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: hud-debug-apk
        path: "**/build/outputs/apk/debug/app-debug.apk"
