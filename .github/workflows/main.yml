name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    # 🟢 الحل الفاصل: تثبيت جافا 11 القياسية المتوافقة 100% مع محرك جرايدل 7.4 القديم
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # 🟢 إجبار السيرفر على استخدام جرايدل 7.4 المتوافق مع سورس كلود
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '7.4'

    - name: Grant execute permission for gradlew
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
        if [ ! -z "$GRADLEW_PATH" ]; then
          chmod +x "$GRADLEW_PATH"
        else
          exit 1
        fi

    - name: Build with Gradle
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
        if [ ! -z "$GRADLEW_PATH" ]; then
          MODULE_DIR=$(dirname "$GRADLEW_PATH")
          cd "$MODULE_DIR"
          ./gradlew assembleDebug
        else
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: hud-debug-apk
        path: "**/build/outputs/apk/debug/app-debug.apk"
